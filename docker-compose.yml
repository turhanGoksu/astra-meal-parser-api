services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"  # reachable from this machine only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        WITH_JUDGE: ${WITH_JUDGE:-false}  # true: image with the LLM judge
    image: astra-nutrition-api:${API_TAG:-latest}
    env_file: .env
    environment:
      POSTGRES_HOST: db     # the db service on the compose network
      MODEL_DIR: /models    # volume: the model is never in the image
      HF_HOME: /hf-cache    # volume: embedding model cache (judge only)
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - models:/models
      - hf-cache:/hf-cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
  hf-cache:
